[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrace-lab"
version = "0.1.0"
description = "OpenTrace research lab — raw data acquisition and storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.14.0"]
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.0.0",
    "google-cloud-storage>=2.14.0",
    "redis>=5.0.0",
]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
